plugins {
    id "com.android.application"
    id "com.google.gms.google-services"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def dartDefines = [:]
if (project.hasProperty('dart-defines')) {
    project.property('dart-defines')
        .split(',')
        .each { encoded ->
            def decoded = new String(Base64.decoder.decode(encoded), 'UTF-8')
            def separatorIndex = decoded.indexOf('=')
            if (separatorIndex > 0) {
                dartDefines[decoded.substring(0, separatorIndex)] =
                    decoded.substring(separatorIndex + 1)
            }
        }
}

def adMobApplicationId =
    project.findProperty('ADMOB_ANDROID_APP_ID')
        ?: dartDefines['ADMOB_ANDROID_APP_ID']
        ?: ''
if (!adMobApplicationId) {
    // The Google Mobile Ads content provider starts before Dart. A blank app ID
    // crashes the process even when ad requests are disabled in Flutter.
    adMobApplicationId = 'ca-app-pub-3940256099942544~3347511713'
}

android {
    namespace = "com.sungals.houseMoneyCalculator"
    compileSdk = 36
    ndkVersion = "26.1.10909125"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    signingConfigs {
        release {
            keyAlias = keystoreProperties['keyAlias']
            keyPassword = keystoreProperties['keyPassword']
            storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword = keystoreProperties['storePassword']
        }
    }

    defaultConfig {
        applicationId = "com.sungals.houseMoneyCalculator"
        minSdk = flutter.minSdkVersion
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        ndk {
            debugSymbolLevel 'SYMBOL_TABLE'
        }
        manifestPlaceholders += [
            adMobApplicationId: adMobApplicationId
        ]
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
}
