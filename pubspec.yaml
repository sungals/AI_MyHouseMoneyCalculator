name: house_money_calculator
description: "전세, 월세, 반전세, 대출이자, 월 고정비를 계산하는 생활금융 계산 앱"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.1

dependencies:
  flutter:
    sdk: flutter

  connectivity_plus: ^6.0.3
  crypto: ^3.0.0
  cupertino_icons: ^1.0.8
  fl_chart: ^0.69.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.19.0
  path_provider: ^2.1.3
  screenshot: ^3.0.0
  share_plus: ^9.0.0
  supabase_flutter: ^2.5.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.3
  mocktail: ^1.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon_1024.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
